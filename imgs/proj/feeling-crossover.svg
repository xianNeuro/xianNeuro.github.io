<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Crossover design: two contexts crossed with two situations; each context is negative for one situation and neutral for the other, so any emotion must come from the conjunction that memory supplies">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a6a85"/>
    </marker>
  </defs>
  <rect width="520" height="300" fill="#ffffff"/>
  <text x="20" y="26" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f3a52">Encoding: two contexts crossed with two situations</text>
  <text x="20" y="44" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Every context and every situation appears in both affective roles</text>

  <!-- column headers -->
  <text x="190" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Situation 1</text>
  <text x="300" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Situation 2</text>
  <!-- row headers -->
  <text x="125" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="end">Context A</text>
  <text x="125" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="end">Context B</text>

  <!-- cells -->
  <rect x="140" y="92" width="100" height="44" rx="6" fill="#f3d9d9" stroke="#c98989"/>
  <text x="190" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7a2e2e" text-anchor="middle">negative</text>
  <rect x="250" y="92" width="100" height="44" rx="6" fill="#eef1f4" stroke="#b9c3cc"/>
  <text x="300" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a5a68" text-anchor="middle">neutral</text>
  <rect x="140" y="152" width="100" height="44" rx="6" fill="#eef1f4" stroke="#b9c3cc"/>
  <text x="190" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a5a68" text-anchor="middle">neutral</text>
  <rect x="250" y="152" width="100" height="44" rx="6" fill="#f3d9d9" stroke="#c98989"/>
  <text x="300" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7a2e2e" text-anchor="middle">negative</text>

  <!-- arrow to test -->
  <line x1="360" y1="144" x2="400" y2="144" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- test box -->
  <rect x="405" y="96" width="100" height="96" rx="8" fill="#eef5fa" stroke="#9bbcd3"/>
  <text x="455" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f3a52" text-anchor="middle">Later</text>
  <text x="455" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f3a52" text-anchor="middle">a context or</text>
  <text x="455" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f3a52" text-anchor="middle">situation alone:</text>
  <text x="455" y="168" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f3a52" text-anchor="middle">what does it</text>
  <text x="455" y="182" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f3a52" text-anchor="middle">feel like?</text>

  <text x="20" y="232" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#333">No context and no situation is negative on its own. Any emotion that emerges can come only from</text>
  <text x="20" y="250" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#333">the conjunction that memory supplies.</text>
  <text x="20" y="280" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#777">Schematic of the design described in the research statement; no data yet.</text>
</svg>
